<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevInterview AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              app: 'var(--bg-app)',
              panel: 'var(--bg-panel)',
              'panel-head': 'var(--bg-panel-head)',
              subtle: 'var(--border-subtle)',
              primary: 'var(--text-primary)',
              secondary: 'var(--text-secondary)',
              accent: 'var(--accent)',
              'accent-contrast': 'var(--accent-contrast)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      
      :root {
        /* Pure Sky Blue & White Theme */
        --bg-app: #f0f9ff;          /* sky-50 */
        --bg-panel: #ffffff;        /* pure white */
        --bg-panel-head: #e0f2fe;   /* sky-100 */
        --border-subtle: #bae6fd;   /* sky-200 */
        --text-primary: #082f49;    /* sky-950 */
        --text-secondary: #0369a1;  /* sky-700 */
        --accent: #0284c7;          /* sky-600 */
        --accent-contrast: #ffffff;
      }

      .light {
        --bg-app: #f0f9ff;
        --bg-panel: #ffffff;
        --bg-panel-head: #e0f2fe;
        --border-subtle: #bae6fd;
        --text-primary: #082f49;
        --text-secondary: #0369a1;
        --accent: #0284c7;
        --accent-contrast: #ffffff;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-app);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Refined sky-blue scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #bae6fd; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0284c7; 
      }
      
      *:focus {
        outline: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
